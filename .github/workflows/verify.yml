name: Verificar cliente público
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Cliente (backend privado fuera de Git)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La suite completa de API requiere la copia privada de server.js.
      - run: npm run test:public
