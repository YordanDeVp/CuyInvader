name: Preparar cliente público
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Build del cliente (pruebas locales fuera de Git)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # docs/ y tests/ se conservan solo localmente.
      # Este job comprueba el build; no ejecuta pruebas automatizadas.
      - run: npm run build
